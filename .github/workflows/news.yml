name: Telegram News Bot

on:
  schedule:
    - cron: "*/10 * * * *"   # هر ۱۰ دقیقه (GitHub ممکن است چند دقیقه تأخیر داشته باشد)
  workflow_dispatch:          # اجرای دستی از تب Actions

permissions:
  contents: write             # برای ذخیره‌ی state/seen.json در ریپو

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          git pull --rebase -X theirs || true
          git push
